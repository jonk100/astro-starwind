name: Sync Changelog to Notion

on:
  push:
    branches:
      - main
    paths:
      - "changelog.json"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Push changelog to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node .github/scripts/push-changelog.mjs